version: "3.9"

services:
  db:
    image: postgres:16
    container_name: complaint_db
    restart: always
    environment:
      POSTGRES_DB: complaint_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

volumes:
  postgres_data: